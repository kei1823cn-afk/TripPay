<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行手帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f5f0de;--card:#fffdf4;--ink:#2b4a47;--mute:#6b8279;--sea:#3a86b8;--sky:#bfe0ef;--sun:#f2b84b;--leaf:#5e9e6e;--line:#d9d3b8;--bad:#c0563f;--serif:"Hiragino Mincho ProN","Songti TC","Noto Serif TC",serif}
@media (prefers-color-scheme:dark){:root{--bg:#16262a;--card:#1f3438;--ink:#eaf1e6;--mute:#9db5ab;--sea:#78b9e0;--sky:#1d3f57;--leaf:#86c28f;--line:#2f4a4d;--bad:#e98a73}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font:700 1.2rem var(--serif);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button,.mini{border:1px solid var(--line);background:var(--card);color:var(--sea);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem}
#sync{font-size:.78rem;color:var(--mute)}
#sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--leaf);margin-right:5px}
#sync.off::before{background:var(--sun)}
[hidden]{display:none!important}
main{max-width:640px;margin:0 auto;padding:12px 16px calc(150px + env(safe-area-inset-bottom,0px))}
.home main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.home nav{display:none}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:9px 0;font:inherit;font-weight:600;font-size:.92rem;border-radius:999px}
nav button.on{background:var(--sun);color:#2b4a47}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--sun);color:#2b4a47;font-size:1.8rem;line-height:1;box-shadow:0 3px 10px rgba(43,74,71,.3);animation:float 3.5s ease-in-out infinite}
.home .fab{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
/* hero scene */
.hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:10px;height:100px;box-shadow:0 8px 22px rgba(58,134,184,.22)}
.hero.big{height:230px}
.hero svg{display:block;width:100%;height:100%}
.hl{position:absolute;left:18px;top:18px;color:#fff;text-shadow:0 1px 8px rgba(20,60,100,.5)}
.hl h1{margin:0;font:800 2rem var(--serif);letter-spacing:.1em}
.hl p{margin:2px 0 0;font-size:.95rem}
.cl{fill:#fffdf6;animation:drift 24s ease-in-out infinite alternate}
.cl.b{animation-duration:32s;animation-delay:-9s}
.cl.c{animation-duration:28s;animation-delay:-16s}
.bob{animation:bob 5s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.in>*{animation:up .45s both;animation-delay:calc(var(--i,0)*55ms)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* content */
h2{display:flex;align-items:center;justify-content:space-between;margin:24px 0 8px;font:700 1.4rem/1.2 var(--serif)}
h2::before{content:"❀";color:var(--leaf);font-size:1rem;margin-right:8px}
h2 .mini{margin-left:auto}
h3{margin:20px 0 6px;font-size:.95rem;color:var(--mute)}
.meta{color:var(--mute);font-size:.9rem;margin:0 2px 4px}
.rail{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px dashed var(--leaf)}
.rail li,.row{background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer;position:relative;box-shadow:0 1px 0 var(--line),0 6px 16px rgba(58,134,184,.09);transition:transform .15s}
.rail li:active,.row:active,.trip:active{transform:scale(.98)}
.rail li::before{content:"";position:absolute;left:-22px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--sun);border:2px solid var(--bg)}
.time{font-weight:700;color:var(--sea);margin-right:8px}
.sub{color:var(--mute);font-size:.88rem}
.note{margin:4px 0 0;white-space:pre-wrap;font-size:.92rem}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.row.blk{display:block}
.row .amt{text-align:right;font-weight:700;white-space:nowrap}
.route{font:700 1.3rem var(--serif);letter-spacing:.05em}.route span{color:var(--sea);margin:0 4px}
a{color:var(--sea)}
.empty{color:var(--mute);padding:26px 8px;text-align:center}
.empty.small{padding:10px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:.85rem;color:var(--mute);font-weight:600}
.pos{color:var(--leaf)}.neg{color:var(--bad)}
.total{font:800 2.1rem var(--serif);margin:6px 0 0}
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:62px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 10px;font:inherit;line-height:1.25;text-align:center}
.dchip b{display:block;font:700 .78rem var(--serif);color:var(--mute)}
.dchip span{font-weight:700}
.dchip.on{background:var(--sun);border-color:var(--sun);color:#2b4a47}
.dchip.on b{color:#2b4a47}
.legcard{background:var(--card);border-radius:16px;padding:2px 14px 12px;margin:14px 0;box-shadow:0 2px 0 var(--line)}
.legcard h2{margin:12px 0 4px}
.fl{padding:10px 0;border-top:1px dashed var(--line);cursor:pointer}
.fl .route{font-size:1.1rem}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block}
.file{display:inline-block;padding:6px 10px;border-radius:10px;background:var(--bg);font-size:.85rem;text-decoration:none}
.fwrap{position:relative;display:inline-block}
.fwrap .x{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:.7rem;padding:0}
.cb{width:24px;height:24px;margin:2px 0 0;accent-color:var(--leaf);flex:none}
.item{justify-content:flex-start;align-items:flex-start;gap:12px}
.item .tt{flex:1;min-width:0;cursor:pointer}
.item.done .tt strong{text-decoration:line-through;color:var(--mute);font-weight:400}
h3.cat{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font:700 1.05rem var(--serif);margin:20px 0 4px}
h3.cat small{font:400 .8rem sans-serif;color:var(--mute)}
details{margin-top:10px}summary{color:var(--sea);font-size:.9rem}
.rail li.leg{background:none;box-shadow:none;padding:1px 0 1px 2px;margin:0;font-size:.85rem;color:var(--mute)}
.rail li.leg::before{display:none}
.rail li.leg:active{transform:none}
.leg .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;border:1px dashed var(--line);background:var(--card)}
.leg.set .pill{border:1px solid var(--leaf);color:var(--ink)}
.catbar{display:flex;gap:8px;justify-content:flex-end;margin:2px 0 0}
body{background-image:linear-gradient(180deg,var(--sky) 0,var(--bg) 360px);background-repeat:no-repeat}
.isl{animation:isl 9s ease-in-out infinite}
.sd{animation:seed 9s linear infinite}
@keyframes isl{50%{transform:translateY(-6px)}}
@keyframes seed{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(36px,-60px);opacity:0}}
.empty:not(.small)::before{content:"";display:block;height:70px;margin-bottom:8px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 64'><ellipse cx='40' cy='40' rx='26' ry='7' fill='%2374b36d'/><path d='M14 40Q20 52 30 58Q40 70 46 56Q56 50 66 40Z' fill='%238c7b66'/><rect x='44' y='28' width='3' height='12' fill='%236e5a43'/><circle cx='46' cy='27' r='9' fill='%233f8a58'/><ellipse cx='16' cy='14' rx='12' ry='5' fill='%23ffffff' fill-opacity='.9'/><ellipse cx='64' cy='10' rx='10' ry='4' fill='%23ffffff' fill-opacity='.9'/></svg>") center/contain no-repeat}
.ct{cursor:pointer;display:flex;align-items:center;gap:6px}
.ct i{font-style:normal;color:var(--sea);width:1em;text-align:center}
.lpanel{margin:6px 0 10px;background:var(--card);border-radius:14px;padding:6px 14px 14px;box-shadow:0 1px 0 var(--line);color:var(--ink);cursor:default;font-size:1rem}
.lpanel .btns{margin-top:10px}
.datebox{margin:8px 0 0;background:var(--bg);border-radius:10px;padding:8px 10px}
.datebox summary{cursor:pointer;color:var(--ink)}
.datebox summary span{color:var(--sea);font-size:.85rem}
.leglock .fab{display:none}
.sf{animation:snowf 6s linear infinite}
@keyframes snowf{0%{transform:translate(0,-6px);opacity:0}10%{opacity:.95}100%{transform:translate(-16px,226px);opacity:0}}
.hero.home::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,50,90,.26),transparent 62%);pointer-events:none}
.hero.home .hl{z-index:1;left:16px;top:14px;right:96px}
.hero.home .hl h1{font-size:1.55rem;letter-spacing:.06em;line-height:1.2}
.cd{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.cd b{font:800 2.7rem/1 var(--serif)}
.cd span{font-size:1rem}
.dr{margin-top:2px;font-size:.9rem}
.editb{position:absolute;right:12px;top:12px;z-index:2;background:rgba(255,253,244,.88)!important;color:#2b4a47!important;border:0!important}
.legcard h2::before{display:none}
.legcard .row{background:var(--bg);box-shadow:none}
.inleg{background:var(--bg);border-radius:14px;padding:8px 12px;margin:8px 0}
.ilh{display:flex;justify-content:space-between;align-items:center}
.ilh b{font:700 1.05rem var(--serif)}
.ilh+.fl{border-top:0}
.wxset{display:flex;gap:8px;margin:6px 0}
.wxrow{display:flex;gap:8px;overflow-x:auto;margin:8px -4px 4px;padding:2px 4px 6px;scrollbar-width:none}
.wxrow::-webkit-scrollbar{display:none}
.wxd{flex:0 0 64px;background:var(--bg);border-radius:12px;padding:6px 4px;text-align:center;line-height:1.3}
.wxi{font-size:1.5rem}
.wxnow{margin:6px 0;font-size:1.05rem}
.wxd.trip{background:var(--sun);color:#2b4a47}
.wxd.trip .sub{color:#2b4a47}
.cstat{margin:8px 0}
.cs1{display:flex;justify-content:space-between;gap:8px}
.cs1 small{color:var(--mute);font-size:.8rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--sun));border-radius:99px}
.tag{font-size:.75rem;background:var(--bg);border-radius:999px;padding:1px 8px;color:var(--sea)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tl{list-style:none;margin:0;padding:0}
.tl li.it,.tl li.leg,.tl li.gap{display:grid;grid-template-columns:52px 14px minmax(0,1fr);column-gap:8px}
.tl .tm{text-align:right;font-weight:700;color:var(--sea);padding-top:16px;line-height:1.1;font-size:.95rem}
.tl .tm small{display:block;font-weight:400;color:var(--mute);font-size:.78rem;margin-top:3px}
.tl .ln{position:relative}
.tl .ln::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--leaf)}
.tl .ln i{position:absolute;left:50%;top:21px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--sun);border:2px solid var(--bg);z-index:1}
.tl .anc .ln i{background:var(--leaf)}
.tl .card{background:var(--card);border-radius:14px;padding:10px 12px;margin:6px 0;box-shadow:0 1px 0 var(--line),0 6px 16px rgba(58,134,184,.09);cursor:pointer;transition:transform .15s}
.tl .card:active{transform:scale(.98)}
.tl .card.dim{opacity:.75;border:1px dashed var(--line);box-shadow:none}
.tl .dur{margin-left:8px;font-size:.78rem;color:var(--sea);background:var(--bg);border-radius:999px;padding:1px 8px;white-space:nowrap}
.tl li.leg{font-size:.85rem;color:var(--mute)}
.tl .lc{padding:2px 0;min-width:0}
.warn{color:var(--bad);font-size:.8rem;margin:3px 0 0 4px}
/* trip cards */
.trip{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:16px;overflow:hidden;margin:12px 0;cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .15s}
.trip .art{display:block;width:100%;height:76px}
.tb{padding:10px 14px 12px}
.tb strong{font:700 1.15rem var(--serif)}
.badge{position:absolute;right:12px;top:10px;background:rgba(255,253,244,.9);color:#2b4a47;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.ed{position:absolute;left:10px;top:8px;width:30px;height:30px;padding:0;border-radius:50%;border:0;background:rgba(255,253,244,.85);color:#2b4a47}
dialog{width:min(520px,calc(100% - 24px));max-height:88vh;border:0;border-radius:18px;padding:18px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(22,38,42,.5)}
label{display:block;margin:10px 0 2px;font-size:.88rem;color:var(--mute)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px}
.chk label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink)}
.chk input{width:auto}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit}
.btns .go{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:700}
.btns .del{color:var(--bad)}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.9rem;display:none;z-index:20}
</style>
</head>
<body>
<header><button id="back" hidden>‹ 旅程</button><h1 id="ttl">旅行手帳</h1><span id="sync"></span><button id="share" hidden>分享</button></header>
<main id="view"></main>
<nav id="tabs"></nav>
<dialog id="dlg"><form id="frm"></form></dialog>
<div id="toast"></div>

<script>
/* ===== 設定：填入 Supabase 後即啟用雲端同步；留空則為本機模式 ===== */
const CONFIG = {
  SUPABASE_URL: 'https://kadmtabkxzzytxyodbhf.supabase.co',
  SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZG10YWJreHp6eXR4eW9kYmhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMDU0ODgsImV4cCI6MjEwOTg4MTQ4OH0.K0ZT8nsJDb-H4SWQC9GcmtHlizR8qkKxuiQKXNIlmL4'
};
const DEFAULT_RATES = { TWD: 1, JPY: 0.21, KRW: 0.023, USD: 32, EUR: 35, THB: 0.9, HKD: 4.1 };
const INFO_CATS = ['簽證入境', '保險', '交通票券', '網卡通訊', '緊急聯絡', '匯兌', '其他'];

/* ===== 基本狀態 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABLES = ['itinerary', 'flights', 'lodging', 'info', 'members', 'expenses', 'restaurants', 'check_cats', 'check_items', 'tw_files', 'reminders'];
const TABS = { trip: '首頁', itinerary: '行程', info: '資訊', money: '記帳', members: '成員' };
const TRIP = new URLSearchParams(location.search).get('trip');   // 沒有 = 首頁
const KEY = 'tw:data:' + TRIP;
const CONFIGURED = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const sb = (CONFIGURED && window.supabase) ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY) : null;
let authMsg = '';
const ready = sb ? (async () => {       // 不需要使用者登入：每支裝置自動取得匿名身分，再用旅程代碼加入旅程
  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) { const r = await sb.auth.signInAnonymously(); if (r.error) { authMsg = r.error.message; return; } }
    if (TRIP) await sb.rpc('join_trip', { p_code: TRIP });
  } catch (e) { authMsg = String(e); }
})() : Promise.resolve();
let online = false, tab = 'trip', wxEdit = false, selDay = null, saving = false, infoTab = 'restaurants', openLeg = null;
let trips = JSON.parse(localStorage.getItem('tw:trips') || '[]');
let state = { itinerary: [], flights: [], lodging: [], info: [], members: [], expenses: [], restaurants: [], check_cats: [], check_items: [], tw_files: [], reminders: [] };
if (TRIP) try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const FKEY = 'tw:fold:' + TRIP;
const folded = new Set(JSON.parse(localStorage.getItem(FKEY) || '[]'));
const foldSave = () => localStorage.setItem(FKEY, JSON.stringify([...folded]));
const curTrip = () => trips.find(t => t.id === TRIP);
const persist = () => { localStorage.setItem('tw:trips', JSON.stringify(trips)); if (TRIP) localStorage.setItem(KEY, JSON.stringify(state)); };
const canEdit = () => !CONFIGURED || online;
const mname = id => state.members.find(m => m.id === id)?.name || '(已刪除)';
const shortId = () => [...crypto.getRandomValues(new Uint8Array(10))].map(b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2200); }
function setSync() { const s = $('#sync'); s.textContent = !CONFIGURED ? '本機模式' : online ? '已同步' : '離線，唯讀'; s.className = (!CONFIGURED || !online) ? 'off' : ''; }

/* ===== 資料層 ===== */
async function loadAll() {
  if (sb) {
    await ready;
    try {
      const tr = await sb.from('tw_trips').select('*'); if (tr.error) throw tr.error;
      trips = tr.data;
      if (TRIP) {
        const res = await Promise.all(TABLES.map(t => sb.from(t).select('*').eq('trip_id', TRIP)));
        res.forEach((r, i) => { if (r.error) throw r.error; state[TABLES[i]] = r.data; });
      }
      await signFiles();
      online = true;
    } catch (e) { online = false; }
  }
  if (TRIP && !curTrip() && !CONFIGURED) {          // 舊連結：自動補一筆旅程
    const t = { id: TRIP, name: TRIP }; trips.push(t);
    if (sb) sb.from('tw_trips').upsert(t);
  }
  persist(); setSync(); render();
}
async function saveRow(t, row) {
  const arr = t === 'tw_trips' ? trips : state[t], i = arr.findIndex(r => r.id === row.id);
  if (i >= 0) arr[i] = row; else arr.push(row);      // 先更新畫面，同 id 不會重複新增
  persist(); render();
  if (sb) {
    if (t === 'tw_trips' && i < 0) {                   // 新旅程：由伺服器建立並自動加入成員
      await ready;
      const r = await sb.rpc('create_trip', { p_id: row.id, p_name: row.name, p_start: row.start_day, p_end: row.end_day });
      if (!r.error && r.data) return loadAll();
    }
    const { error } = await sb.from(t).upsert(t === 'tw_trips' ? row : { ...row, trip_id: TRIP });
    if (error) toast('儲存失敗：' + error.message);
    return loadAll();
  }
}
async function purgeFiles(ids) {
  const fs = state.tw_files.filter(f => ids.includes(f.owner_id));
  if (!fs.length) return;
  if (sb) { await sb.storage.from('tw-files').remove(fs.map(f => f.path)); await sb.from('tw_files').delete().in('id', fs.map(f => f.id)); }
  state.tw_files = state.tw_files.filter(f => !ids.includes(f.owner_id));
}
async function delRow(t, id) {
  if (t === 'restaurants' || t === 'check_items' || t === 'itinerary') await purgeFiles([id]);
  if (t === 'check_cats') {
    if (state.check_cats.find(c => c.id === id)?.kind === 'restaurants') {
      state.restaurants.forEach(r => { if (r.cat_id === id) r.cat_id = null; });

    } else {
      await purgeFiles(state.check_items.filter(i => i.cat_id === id).map(i => i.id));
      if (sb) await sb.from('check_items').delete().eq('cat_id', id);
      state.check_items = state.check_items.filter(i => i.cat_id !== id);
    }
  }
  if (sb) {
    if (t === 'tw_trips') {
      for (const x of TABLES) await sb.from(x).delete().eq('trip_id', id);
    }
    const { error } = await sb.from(t).delete().eq('id', id);

  }

}

$('#frm').onsubmit = async e => {

  const fd = new FormData(e.target), vals = {};

  const row = { ...(existing || {}), ...vals, ...(existing ? {} : cur.extra || {}) };

function shrink(f) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); c.toBlob(b => res(b || f), 'image/jpeg', .85);
    };
    img.onerror = () => res(f);
    img.src = URL.createObjectURL(f);
  });
}
async function uploadFiles(owner_table, owner_id, files) {
  for (const f of files) {
    let blob = f, name = f.name, mime = f.type || 'application/octet-stream';
    if (f.size > 10485760) { toast(name + ' 超過 10MB，已略過'); continue; }
    if (mime.startsWith('image/')) { blob = await shrink(f); mime = blob.type || 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
    const ext = mime === 'application/pdf' ? 'pdf' : (name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin');
    const path = `${TRIP}/${owner_id}/${crypto.randomUUID()}.${ext}`;
    const { error } = await sb.storage.from('tw-files').upload(path, blob, { contentType: mime });
    if (error) { toast('上傳失敗：' + error.message); continue; }
    await sb.from('tw_files').insert({ id: crypto.randomUUID(), trip_id: TRIP, owner_table, owner_id, name, path, mime, size: blob.size });
  }
}

async function geoCity(name) {
  const k = 'tw:geoc2:' + name, c = localStorage.getItem(k); if (c) return JSON.parse(c);
  let v = null;
  try { const j = await getJSON('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=zh-TW&q=' + encodeURIComponent(name)); if (j[0]) v = { lat: +j[0].lat, lon: +j[0].lon }; } catch (e) {}
  if (!v) { try { const j = await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&format=json&name=' + encodeURIComponent(name)); const r = j.results?.[0]; if (r) v = { lat: r.latitude, lon: r.longitude }; } catch (e) {} }

}
async function fetchWeather(t) {
  const ck = 'tw:wx2:' + t.weather_place, c = JSON.parse(localStorage.getItem(ck) || 'null');
  if (c && Date.now() - c.t < 3600e3) return c.data;
  const g = await geoCity(t.weather_place); if (!g) throw new Error('nogeo');

  const data = { now: j.current ? { temp: j.current.temperature_2m, code: j.current.weather_code } : null,
    rows: j.daily.time.map((d, i) => ({ d, code: j.daily.weather_code[i], hi: j.daily.temperature_2m_max[i], lo: j.daily.temperature_2m_min[i], pop: j.daily.precipitation_probability_max[i] })) };
  localStorage.setItem(ck, JSON.stringify({ t: Date.now(), data })); return data;
}

const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function tripDays() {          // 旅程出發日～回程日自動展開，再加上行程裡出現過的日期
  const t = curTrip(), set = new Set(state.itinerary.map(r => r.day).filter(Boolean));

}

      const its = state.info.filter(r => (r.category || '其他') === c), k = 'n:' + c, open = !folded.has(k);
      return `<h3 class="cat"><span class="ct" data-fold="${esc(k)}"><i>${open ? '▾' : '▸'}</i>${esc(c)} <small>${its.length}</small></span></h3>` +
        (open ? its.map(r => `<div class="row blk" data-edit="info:${r.id}"><strong>${esc(r.title)}</strong>${r.content ? `<p class="note">${esc(r.content)}</p>` : ''}</div>`).join('') : '');
    }).join('') + add('info');
  },
  members() {
    return (state.members.length ? state.members.map(m => `<div class="row" data-edit="members:${m.id}"><strong>${esc(m.name)}</strong></div>`).join('')
      : `<div class="empty">先新增旅伴，記帳分帳才能使用。</div>`) + add('members');
  },
  money() {
    const ex = [...state.expenses].sort((a, b) => (b.day || '').localeCompare(a.day || ''));
    if (!ex.length) return `<div class="empty">還沒有支出。${state.members.length ? '' : '請先到「成員」新增旅伴。'}</div>` + add('expenses');
    const bal = {}; state.members.forEach(m => bal[m.id] = { paid: 0, share: 0 });
    ex.forEach(e => {
      const t = twd(e), ids = (e.split?.length ? e.split : state.members.map(m => m.id)).filter(i => bal[i]);
      const ps = payersOf(e).filter(i => bal[i]); ps.forEach(i => bal[i].paid += t / ps.length);
      ids.forEach(i => bal[i].share += t / ids.length);
    });
    const net = state.members.map(m => ({ id: m.id, v: bal[m.id].paid - bal[m.id].share }));
    const cr = net.filter(x => x.v > 0.5).map(x => ({ ...x })).sort((a, b) => b.v - a.v);
    const db = net.filter(x => x.v < -0.5).map(x => ({ id: x.id, v: -x.v })).sort((a, b) => b.v - a.v);
    const pay = []; let i = 0, j = 0;
    while (i < db.length && j < cr.length) {
      const a = Math.min(db[i].v, cr[j].v); pay.push([db[i].id, cr[j].id, a]);
      db[i].v -= a; cr[j].v -= a; if (db[i].v < 0.5) i++; if (cr[j].v < 0.5) j++;
    }
    return `<div class="sub">總支出（台幣）</div><div class="total">${nt(ex.reduce((s, e) => s + twd(e), 0))}</div>${catStats(ex)}
      <h3>每人結算</h3><table><tr><th></th><th>已付</th><th>應分攤</th><th>差額</th></tr>
      ${state.members.map(m => { const b = bal[m.id], n = b.paid - b.share; return `<tr><td>${esc(m.name)}</td><td>${Math.round(b.paid).toLocaleString()}</td><td>${Math.round(b.share).toLocaleString()}</td><td class="${n >= 0 ? 'pos' : 'neg'}">${n >= 0 ? '+' : ''}${Math.round(n).toLocaleString()}</td></tr>`; }).join('')}</table>
      <h3>建議還款</h3>${pay.length ? pay.map(p => `<div class="row"><span>${esc(mname(p[0]))} → ${esc(mname(p[1]))}</span><span class="amt">${nt(p[2])}</span></div>`).join('') : '<div class="sub">目前沒有需要還款的人。</div>'}
      <h3>支出紀錄</h3>${ex.map(e => `<div class="row" data-edit="expenses:${e.id}"><div><strong>${esc(e.title)}</strong><div class="sub">${e.category ? `<span class="tag">${esc(e.category)}</span> ` : ''}${fmtDay(e.day)} · ${esc(payNames(e))} 付 · ${(e.split?.length || state.members.length)} 人分攤</div>${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}</div>
        <div class="amt">${Number(e.amount).toLocaleString()} ${esc(e.currency)}${e.currency !== 'TWD' ? `<div class="sub">≈ ${nt(twd(e))}</div>` : ''}</div></div>`).join('')}` + add('expenses');
  }
};

let fresh = true;
function render() {
  document.body.className = TRIP ? '' : 'home';
  $('#back').hidden = $('#share').hidden = !TRIP;
  const t = curTrip();
  $('#ttl').textContent = TRIP ? (t?.name || '旅程') : '旅行手帳';
  document.title = TRIP ? (t?.name || '旅程') + ' · 旅行手帳' : '旅行手帳';
  $('#tabs').innerHTML = TRIP ? Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v}</button>`).join('') : '';
  const head = TRIP ? (tab === 'trip' ? homeHero(t) : `<div class="hero">${scene('small')}</div>${t ? `<div class="meta">${range(t)} ${countdown(t) ? '· ' + countdown(t) : ''}</div>` : ''}`) : '';
  const v = $('#view');
  v.className = (fresh ? 'in' : '') + (openLeg ? ' leglock' : '');
  v.innerHTML = head + (TRIP ? views[tab]() : views.home());
  fresh = false;
  $('.dchip.on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  { const c = $('.wxrow'), e = $('.wxd.trip'); if (c && e) c.scrollLeft = e.offsetLeft - c.offsetLeft - 8; }
  if (TRIP && tab === 'trip') ensureWeather();
}
document.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const el = e.target.closest('[data-tab],[data-add],[data-edit],[data-go],[data-day],[data-sub],[data-preset],[data-rmfile],[data-trans],[data-tsave],[data-tcancel],[data-test],[data-fold],[data-foldall],[data-wxsave],[data-wxedit],[data-catpick],[data-join]'); if (!el) return;
  if (el.dataset.go) location.search = '?trip=' + encodeURIComponent(el.dataset.go);
  else if ('day' in el.dataset) { selDay = el.dataset.day; openLeg = null; render(); }
  else if (el.dataset.sub) { infoTab = el.dataset.sub; render(); }
  else if (el.dataset.preset) addPreset(el.dataset.preset);
  else if (el.dataset.rmfile) rmFile(el.dataset.rmfile);
  else if (el.dataset.trans) toggleLeg(el.dataset.trans);
  else if ('wxsave' in el.dataset) { if (!canEdit()) return toast('離線中，目前只能查看'); const v = ($('#wxplace')?.value || '').trim(); if (!curTrip()) return toast('找不到這趟旅程'); wxEdit = false; wx = { key: '', rows: [], msg: '', loading: false }; saveRow('tw_trips', { ...curTrip(), weather_place: v || null }); }
  else if ('join' in el.dataset) joinTrip();
  else if ('wxedit' in el.dataset) { wxEdit = true; render(); }
  else if ('catpick' in el.dataset) { const i = $('[name=category]'); if (i) i.value = el.dataset.catpick; }
  else if ('tsave' in el.dataset) saveLeg(el.dataset.tsave);
  else if ('tcancel' in el.dataset) { openLeg = null; render(); }
  else if ('test' in el.dataset) estLeg();
  else if (el.dataset.fold) { const k = el.dataset.fold; folded.has(k) ? folded.delete(k) : folded.add(k); foldSave(); render(); }
  else if (el.dataset.foldall) { const ids = el.dataset.foldall.split(','), anyOpen = ids.some(i => !folded.has(i)); ids.forEach(i => anyOpen ? folded.add(i) : folded.delete(i)); foldSave(); render(); }
  else if (el.dataset.tab) { tab = el.dataset.tab; openLeg = null; fresh = true; render(); scrollTo(0, 0); }
  else if (el.dataset.add) {
    const ex = {}; if (el.dataset.cat) ex.cat_id = el.dataset.cat; if (el.dataset.leg) ex.leg = el.dataset.leg;
    if (el.dataset.add === 'check_items' || el.dataset.add === 'check_cats') ex.kind = infoTab;
    openForm(el.dataset.add, null, ex);
  }
  else { const [t, id] = el.dataset.edit.split(':'); openForm(t, id); }
});
document.addEventListener('change', e => {
  const sel = e.target.closest('.lpanel [name=mode]');
  if (sel) {
    const pn = sel.closest('.lpanel'), r = state.itinerary.find(x => x.id === pn.dataset.lp), rows = dayRows();
    pn.querySelector('[data-gmap]').href = gmapUrl(sel.value, rawPlace(prevOf(r.id)), rawPlace(r)); return;
  }
  const el = e.target.closest('[data-toggle]'); if (!el) return;
  const r = state.check_items.find(x => x.id === el.dataset.toggle); if (!r) return;
  if (!canEdit()) { el.checked = !el.checked; return toast('離線中，目前只能查看'); }
  saveRow('check_items', { ...r, done: el.checked });
});
$('#back').onclick = () => { location.href = location.pathname; };
$('#share').onclick = async () => {
  const url = location.origin + location.pathname + '?trip=' + encodeURIComponent(TRIP);
  try { await navigator.clipboard.writeText(url); toast('已複製這趟旅程的連結'); } catch (e) { prompt('複製這個連結', url); }
};
addEventListener('online', loadAll);
addEventListener('offline', () => { online = false; setSync(); });

setSync(); render(); loadAll(); subscribe();
</script>
</body>
