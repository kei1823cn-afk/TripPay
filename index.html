<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行手帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f5f0de;--card:#fffdf4;--ink:#2b4a47;--mute:#6b8279;--sea:#3e8e9b;--sun:#f2b84b;--leaf:#5e9e6e;--line:#d9d3b8;--bad:#c0563f;--serif:"Hiragino Mincho ProN","Songti TC","Noto Serif TC",serif}
@media (prefers-color-scheme:dark){:root{--bg:#16262a;--card:#1f3438;--ink:#eaf1e6;--mute:#9db5ab;--sea:#6fc0c8;--leaf:#86c28f;--line:#2f4a4d;--bad:#e98a73}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font:700 1.2rem var(--serif);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button,.mini{border:1px solid var(--line);background:var(--card);color:var(--sea);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem}
#sync{font-size:.78rem;color:var(--mute)}
#sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--leaf);margin-right:5px}
#sync.off::before{background:var(--sun)}
[hidden]{display:none!important}
main{max-width:640px;margin:0 auto;padding:12px 16px calc(150px + env(safe-area-inset-bottom,0px))}
.home main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.home nav{display:none}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:9px 0;font:inherit;font-weight:600;font-size:.92rem;border-radius:999px}
nav button.on{background:var(--sun);color:#2b4a47}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--sun);color:#2b4a47;font-size:1.8rem;line-height:1;box-shadow:0 3px 10px rgba(43,74,71,.3);animation:float 3.5s ease-in-out infinite}
.home .fab{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
/* hero scene */
.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:10px;height:92px}
.hero.big{height:200px}
.hero svg{display:block;width:100%;height:100%}
.hl{position:absolute;left:18px;top:18px;color:#2b4a47}
.hl h1{margin:0;font:800 2rem var(--serif);letter-spacing:.1em}
.hl p{margin:2px 0 0;font-size:.95rem}
.cl{fill:#fffdf6;animation:drift 24s ease-in-out infinite alternate}
.cl.b{animation-duration:32s;animation-delay:-9s}
.cl.c{animation-duration:28s;animation-delay:-16s}
.bob{animation:bob 5s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.in>*{animation:up .45s both;animation-delay:calc(var(--i,0)*55ms)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* content */
h2{display:flex;align-items:center;justify-content:space-between;margin:24px 0 8px;font:700 1.4rem/1.2 var(--serif)}
h2::before{content:"❀";color:var(--leaf);font-size:1rem;margin-right:8px}
h2 .mini{margin-left:auto}
h3{margin:20px 0 6px;font-size:.95rem;color:var(--mute)}
.meta{color:var(--mute);font-size:.9rem;margin:0 2px 4px}
.rail{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px dashed var(--leaf)}
.rail li,.row{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;position:relative;box-shadow:0 1px 0 var(--line);transition:transform .15s}
.rail li:active,.row:active,.trip:active{transform:scale(.98)}
.rail li::before{content:"";position:absolute;left:-22px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--sun);border:2px solid var(--bg)}
.time{font-weight:700;color:var(--sea);margin-right:8px}
.sub{color:var(--mute);font-size:.88rem}
.note{margin:4px 0 0;white-space:pre-wrap;font-size:.92rem}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.row.blk{display:block}
.row .amt{text-align:right;font-weight:700;white-space:nowrap}
.route{font:700 1.3rem var(--serif);letter-spacing:.05em}.route span{color:var(--sea);margin:0 4px}
a{color:var(--sea)}
.empty{color:var(--mute);padding:26px 8px;text-align:center}
.empty.small{padding:10px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:.85rem;color:var(--mute);font-weight:600}
.pos{color:var(--leaf)}.neg{color:var(--bad)}
.total{font:800 2.1rem var(--serif);margin:6px 0 0}
/* trip cards */
.trip{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:16px;overflow:hidden;margin:12px 0;cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .15s}
.trip .art{display:block;width:100%;height:76px}
.tb{padding:10px 14px 12px}
.tb strong{font:700 1.15rem var(--serif)}
.badge{position:absolute;right:12px;top:10px;background:rgba(255,253,244,.9);color:#2b4a47;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.ed{position:absolute;left:10px;top:8px;width:30px;height:30px;padding:0;border-radius:50%;border:0;background:rgba(255,253,244,.85);color:#2b4a47}
dialog{width:min(520px,calc(100% - 24px));max-height:88vh;border:0;border-radius:18px;padding:18px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(22,38,42,.5)}
label{display:block;margin:10px 0 2px;font-size:.88rem;color:var(--mute)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px}
.chk label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink)}
.chk input{width:auto}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit}
.btns .go{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:700}
.btns .del{color:var(--bad)}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.9rem;display:none;z-index:20}
</style>
</head>
<body>
<header><button id="back" hidden>‹ 行程</button><h1 id="ttl">旅行手帳</h1><span id="sync"></span><button id="share" hidden>分享</button></header>
<main id="view"></main>
<nav id="tabs"></nav>
<dialog id="dlg"><form id="frm"></form></dialog>
<div id="toast"></div>

<script>
/* ===== 設定：填入 Supabase 後即啟用雲端同步；留空則為本機模式 ===== */
const CONFIG = {
  SUPABASE_URL: 'https://kadmtabkxzzytxyodbhf.supabase.co',
  SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZG10YWJreHp6eXR4eW9kYmhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMDU0ODgsImV4cCI6MjEwOTg4MTQ4OH0.K0ZT8nsJDb-H4SWQC9GcmtHlizR8qkKxuiQKXNIlmL4'
};
const DEFAULT_RATES = { TWD: 1, JPY: 0.21, KRW: 0.023, USD: 32, EUR: 35, THB: 0.9, HKD: 4.1 };
const INFO_CATS = ['簽證入境', '保險', '交通票券', '網卡通訊', '緊急聯絡', '匯兌', '其他'];

/* ===== 基本狀態 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABLES = ['itinerary', 'flights', 'lodging', 'info', 'members', 'expenses'];
const TABS = { itinerary: '行程', trip: '航住', info: '資訊', money: '記帳', members: '成員' };
const TRIP = new URLSearchParams(location.search).get('trip');   // 沒有 = 首頁
const KEY = 'tw:data:' + TRIP;
const CONFIGURED = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const sb = (CONFIGURED && window.supabase) ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY) : null;
let online = false, tab = 'itinerary';
let trips = JSON.parse(localStorage.getItem('tw:trips') || '[]');
let state = { itinerary: [], flights: [], lodging: [], info: [], members: [], expenses: [] };
if (TRIP) try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const curTrip = () => trips.find(t => t.id === TRIP);
const persist = () => { localStorage.setItem('tw:trips', JSON.stringify(trips)); if (TRIP) localStorage.setItem(KEY, JSON.stringify(state)); };
const canEdit = () => !CONFIGURED || online;
const mname = id => state.members.find(m => m.id === id)?.name || '(已刪除)';
const shortId = () => Math.random().toString(36).slice(2, 8);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2200); }
function setSync() { const s = $('#sync'); s.textContent = !CONFIGURED ? '本機模式' : online ? '已同步' : '離線，唯讀'; s.className = (!CONFIGURED || !online) ? 'off' : ''; }

/* ===== 資料層 ===== */
async function loadAll() {
  if (sb) {
    try {
      const tr = await sb.from('tw_trips').select('*'); if (tr.error) throw tr.error;
      trips = tr.data;
      if (TRIP) {
        const res = await Promise.all(TABLES.map(t => sb.from(t).select('*').eq('trip_id', TRIP)));
        res.forEach((r, i) => { if (r.error) throw r.error; state[TABLES[i]] = r.data; });
      }
      online = true;
    } catch (e) { online = false; }
  }
  if (TRIP && !curTrip() && (online || !CONFIGURED)) {          // 舊連結：自動補一筆旅程
    const t = { id: TRIP, name: TRIP }; trips.push(t);
    if (sb) sb.from('tw_trips').upsert(t);
  }
  persist(); setSync(); render();
}
async function saveRow(t, row) {
  if (sb) {
    const { error } = await sb.from(t).upsert(t === 'tw_trips' ? row : { ...row, trip_id: TRIP });
    if (error) return toast('儲存失敗：' + error.message);
    return loadAll();
  }
  const arr = t === 'tw_trips' ? trips : state[t], i = arr.findIndex(r => r.id === row.id);
  if (i >= 0) arr[i] = row; else arr.push(row);
  persist(); render();
}
async function delRow(t, id) {
  if (sb) {
    if (t === 'tw_trips') {
      for (const x of TABLES) await sb.from(x).delete().eq('trip_id', id);
    }
    const { error } = await sb.from(t).delete().eq('id', id);
    if (error) return toast('刪除失敗：' + error.message);
    return loadAll();
  }
  if (t === 'tw_trips') { trips = trips.filter(r => r.id !== id); localStorage.removeItem('tw:data:' + id); }
  else state[t] = state[t].filter(r => r.id !== id);
  persist(); render();
}
function subscribe() {
  if (!sb) return;
  let ch = sb.channel('tw-' + (TRIP || 'home')).on('postgres_changes', { event: '*', schema: 'public', table: 'tw_trips' }, loadAll);
  if (TRIP) TABLES.forEach(t => { ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: t, filter: 'trip_id=eq.' + TRIP }, loadAll); });
  ch.subscribe();
}

/* ===== 表單 ===== */
const FORMS = {
  tw_trips:  { title: '旅程', fields: [['name','text','旅程名稱（例如：東京五日）'],['dest','text','目的地'],['start_day','date','出發日'],['end_day','date','回程日']] },
  itinerary: { title: '行程', fields: [['day','date','日期'],['time','time','時間'],['title','text','活動'],['place','text','地點'],['note','textarea','備註']] },
  flights:   { title: '航班', fields: [['flight_no','text','航班編號（例如 BR198）'],['dep_airport','text','出發機場'],['arr_airport','text','抵達機場'],['dep_time','datetime-local','起飛時間（當地）'],['arr_time','datetime-local','抵達時間（當地）'],['booking_ref','text','訂位代號'],['note','textarea','備註（行李、座位…）']] },
  lodging:   { title: '住宿', fields: [['name','text','住宿名稱'],['address','text','地址'],['check_in','date','入住日'],['check_out','date','退房日'],['booking_ref','text','訂房編號'],['url','url','訂房或地圖連結'],['note','textarea','備註（入住時間、設備…）']] },
  info:      { title: '資訊', fields: [['category','text','分類（可自行輸入）'],['title','text','標題'],['content','textarea','內容']] },
  members:   { title: '成員', fields: [['name','text','名稱']] },
  expenses:  { title: '支出' }
};
function fieldHtml([k, type, label], v) {
  const val = esc(v ?? '');
  if (type === 'textarea') return `<label>${label}</label><textarea name="${k}">${val}</textarea>`;
  const req = (k === 'title' || k === 'name') ? 'required' : '';
  const list = k === 'category' ? 'list="cats"' : '';
  return `<label>${label}</label><input name="${k}" type="${type}" value="${val}" ${req} ${list}>` + (k === 'category' ? `<datalist id="cats">${INFO_CATS.map(c => `<option value="${c}">`).join('')}</datalist>` : '');
}
function formHtml(t, row) {
  if (t !== 'expenses') return FORMS[t].fields.map(f => fieldHtml(f, row[f[0]])).join('');
  const cur = row.currency || 'TWD', rate = row.rate ?? DEFAULT_RATES[cur] ?? 1;
  const split = row.split?.length ? row.split : state.members.map(m => m.id);
  const opts = (arr, sel) => arr.map(([v, l]) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(l)}</option>`).join('');
  return `
    <label>項目</label><input name="title" required value="${esc(row.title)}">
    <label>日期</label><input name="day" type="date" value="${esc(row.day || new Date().toISOString().slice(0, 10))}">
    <label>金額</label><input name="amount" type="number" step="any" required value="${esc(row.amount)}">
    <label>幣別</label><select name="currency" id="cur">${opts(Object.keys(DEFAULT_RATES).map(c => [c, c]), cur)}</select>
    <label>匯率（1 單位 = 多少台幣）</label><input name="rate" id="rate" type="number" step="any" value="${rate}">
    <label>付款人</label><select name="payer">${opts(state.members.map(m => [m.id, m.name]), row.payer)}</select>
    <label>分攤成員</label><div class="chk">${state.members.map(m => `<label><input type="checkbox" name="split" value="${m.id}" ${split.includes(m.id) ? 'checked' : ''}>${esc(m.name)}</label>`).join('')}</div>`;
}
let cur = null;
function openForm(t, id) {
  if (!canEdit()) return toast('離線中，目前只能查看');
  if (t === 'expenses' && !state.members.length) return toast('請先到「成員」新增成員');
  const row = id ? (t === 'tw_trips' ? trips : state[t]).find(r => r.id === id) : (t === 'itinerary' ? { day: curTrip()?.start_day } : {});
  cur = { t, id };
  $('#frm').innerHTML = `<h3 style="margin:0;font-family:var(--serif);font-size:1.1rem;color:var(--ink)">${id ? '編輯' : '新增'}${FORMS[t].title}</h3>${formHtml(t, row)}
    <div class="btns">${id ? '<button type="button" class="del" id="del">刪除</button>' : ''}<button type="button" id="cancel">取消</button><button class="go">儲存</button></div>`;
  $('#cancel').onclick = () => $('#dlg').close();
  if ($('#del')) $('#del').onclick = async () => { if (confirm(t === 'tw_trips' ? '刪除旅程會連同所有行程、資訊與帳務一起刪除，確定嗎？' : '確定刪除？')) { await delRow(t, id); $('#dlg').close(); } };
  if ($('#cur')) $('#cur').onchange = e => { $('#rate').value = DEFAULT_RATES[e.target.value] ?? 1; };
  $('#dlg').showModal();
}
$('#frm').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target), row = {};
  for (const [k, v] of fd.entries()) if (k !== 'split') row[k] = v === '' ? null : v;
  if (cur.t === 'expenses') { row.split = fd.getAll('split'); row.amount = +row.amount; row.rate = +row.rate || 1; }
  row.id = cur.id || (cur.t === 'tw_trips' ? shortId() : crypto.randomUUID());
  await saveRow(cur.t, row);
  $('#dlg').close();
};

/* ===== 插圖 ===== */
const scene = () => `<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dc4e8"/><stop offset="1" stop-color="#e6f4ef"/></linearGradient></defs>
<rect width="400" height="200" fill="url(#sk)"/>
<circle cx="325" cy="52" r="42" fill="#fbe29a" opacity=".35"/><circle cx="325" cy="52" r="24" fill="#fbe29a"/>
<g class="cl"><ellipse cx="80" cy="52" rx="36" ry="12"/><ellipse cx="102" cy="43" rx="22" ry="14"/><ellipse cx="60" cy="45" rx="20" ry="11"/></g>
<g class="cl b"><ellipse cx="240" cy="30" rx="30" ry="9"/><ellipse cx="256" cy="23" rx="17" ry="10"/></g>
<g class="cl c"><ellipse cx="170" cy="92" rx="26" ry="8"/><ellipse cx="182" cy="86" rx="15" ry="9"/></g>
<g transform="translate(250 82)"><g class="bob"><ellipse rx="15" ry="18" fill="#f2a7a0"/><ellipse rx="6" ry="18" fill="#fffdf6"/><path d="M-7 16L-4 27H4L7 16" fill="none" stroke="#8a6a4f" stroke-width="1.2"/><rect x="-5" y="27" width="10" height="7" rx="1.5" fill="#a9825f"/></g></g>
<path d="M0 148Q80 108 170 138T400 122V200H0Z" fill="#8cc084"/>
<path d="M0 176Q100 140 210 168T400 158V200H0Z" fill="#5e9e6e"/>
<path d="M44 160l6-16 6 16zM60 162l5-12 5 12z" fill="#3f7d57"/></svg>`;
const PALS = [['#8ec9e8', '#fbe29a', '#8cc084'], ['#f6c7a4', '#fff1c9', '#7fa77a'], ['#a9c8e8', '#fffdf6', '#6aa58b'], ['#c9b8e0', '#fbe29a', '#7faf9a']];
const hash = s => [...s].reduce((a, c) => a + c.charCodeAt(0), 0);
const art = id => { const p = PALS[hash(id) % PALS.length]; return `<svg class="art" viewBox="0 0 200 76" preserveAspectRatio="xMidYMid slice"><rect width="200" height="76" fill="${p[0]}"/><circle cx="160" cy="26" r="13" fill="${p[1]}"/><path d="M0 56Q50 32 100 52T200 44V76H0Z" fill="${p[2]}"/></svg>`; };

/* ===== 畫面 ===== */
const add = t => `<button class="fab" data-add="${t}" aria-label="新增">＋</button>`;
const fmtDay = d => d ? new Date(d + 'T00:00').toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' }) : '未排日期';
const fmtDT = s => s ? s.replace('T', ' ').slice(5) : '—';
const twd = e => (+e.amount || 0) * (+e.rate || 1);
const nt = n => 'NT$ ' + Math.round(n).toLocaleString();
const range = t => t.start_day ? t.start_day.slice(5).replace('-', '/') + (t.end_day ? ' – ' + t.end_day.slice(5).replace('-', '/') : '') : '';
const countdown = t => {
  if (!t.start_day) return '';
  const today = new Date().toISOString().slice(0, 10), d = Math.round((new Date(t.start_day) - new Date(today)) / 864e5);
  return d > 0 ? `還有 ${d} 天` : (t.end_day && today > t.end_day) ? '已結束' : '旅行中';
};
const link = u => /^https?:\/\//.test(u || '') ? `<a href="${esc(u)}" target="_blank" rel="noopener">連結</a>` : '';

const views = {
  home() {
    const rows = [...trips].sort((a, b) => (a.start_day || '9').localeCompare(b.start_day || '9'));
    return `<div class="hero big">${scene()}<div class="hl"><h1>旅行手帳</h1><p>今天，要去哪裡呢？</p></div></div>` +
      (rows.length ? rows.map((t, i) => `<div class="trip" style="--i:${i + 1}" data-go="${esc(t.id)}">${art(t.id)}<span class="badge">${countdown(t) || '尚未排日期'}</span><button class="ed" data-edit="tw_trips:${esc(t.id)}" aria-label="編輯">✎</button>
        <div class="tb"><strong>${esc(t.name)}</strong><div class="sub">${esc(t.dest || '')} ${range(t)}</div></div></div>`).join('')
        : `<div class="empty">還沒有旅程，按右下角出發吧。</div>`) + add('tw_trips');
  },
  itinerary() {
    const rows = [...state.itinerary].sort((a, b) => (a.day || '9').localeCompare(b.day || '9') || (a.time || '').localeCompare(b.time || ''));
    if (!rows.length) return `<div class="empty">還沒有行程，按右下角新增第一筆。</div>` + add('itinerary');
    return [...new Set(rows.map(r => r.day || ''))].map(d => `<h2>${fmtDay(d)}</h2><ul class="rail">${rows.filter(r => (r.day || '') === d).map(r => `
      <li data-edit="itinerary:${r.id}"><span class="time">${esc(r.time || '')}</span><strong>${esc(r.title)}</strong>
      ${r.place ? `<div class="sub">${esc(r.place)}</div>` : ''}${r.note ? `<p class="note">${esc(r.note)}</p>` : ''}</li>`).join('')}</ul>`).join('') + add('itinerary');
  },
  trip() {
    const fl = [...state.flights].sort((a, b) => (a.dep_time || '').localeCompare(b.dep_time || ''));
    const lg = [...state.lodging].sort((a, b) => (a.check_in || '').localeCompare(b.check_in || ''));
    return `<h2>航班<button class="mini" data-add="flights">＋ 新增</button></h2>` +
      (fl.length ? fl.map(f => `<div class="row blk" data-edit="flights:${f.id}"><div class="route">${esc(f.dep_airport || '—')}<span>✈</span>${esc(f.arr_airport || '—')}</div>
        <div class="sub">${esc(f.flight_no || '')}${f.booking_ref ? ' · 訂位代號 ' + esc(f.booking_ref) : ''}</div><div class="sub">${fmtDT(f.dep_time)} → ${fmtDT(f.arr_time)}</div>${f.note ? `<p class="note">${esc(f.note)}</p>` : ''}</div>`).join('') : `<div class="empty small">還沒有航班</div>`) +
      `<h2>住宿<button class="mini" data-add="lodging">＋ 新增</button></h2>` +
      (lg.length ? lg.map(l => { const n = l.check_in && l.check_out ? Math.round((new Date(l.check_out) - new Date(l.check_in)) / 864e5) : 0;
        return `<div class="row blk" data-edit="lodging:${l.id}"><strong>${esc(l.name)}</strong>
        <div class="sub">${l.check_in ? fmtDay(l.check_in) : '—'} → ${l.check_out ? fmtDay(l.check_out) : '—'}${n ? `（${n} 晚）` : ''}</div>
        ${l.address ? `<div class="sub"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.address)}" target="_blank" rel="noopener">${esc(l.address)}</a></div>` : ''}
        <div class="sub">${l.booking_ref ? '訂房編號 ' + esc(l.booking_ref) + ' ' : ''}${link(l.url)}</div>${l.note ? `<p class="note">${esc(l.note)}</p>` : ''}</div>`; }).join('') : `<div class="empty small">還沒有住宿</div>`);
  },
  info() {
    if (!state.info.length) return `<div class="empty">簽證、保險、交通票券、緊急聯絡等資料放這裡。</div>` + add('info');
    const cats = [...new Set(state.info.map(r => r.category || '其他'))];
    return cats.map(c => `<h3>${esc(c)}</h3>${state.info.filter(r => (r.category || '其他') === c).map(r => `
      <div class="row blk" data-edit="info:${r.id}"><strong>${esc(r.title)}</strong>${r.content ? `<p class="note">${esc(r.content)}</p>` : ''}</div>`).join('')}`).join('') + add('info');
  },
  members() {
    return (state.members.length ? state.members.map(m => `<div class="row" data-edit="members:${m.id}"><strong>${esc(m.name)}</strong></div>`).join('')
      : `<div class="empty">先新增旅伴，記帳分帳才能使用。</div>`) + add('members');
  },
  money() {
    const ex = [...state.expenses].sort((a, b) => (b.day || '').localeCompare(a.day || ''));
    if (!ex.length) return `<div class="empty">還沒有支出。${state.members.length ? '' : '請先到「成員」新增旅伴。'}</div>` + add('expenses');
    const bal = {}; state.members.forEach(m => bal[m.id] = { paid: 0, share: 0 });
    ex.forEach(e => {
      const t = twd(e), ids = (e.split?.length ? e.split : state.members.map(m => m.id)).filter(i => bal[i]);
      if (bal[e.payer]) bal[e.payer].paid += t;
      ids.forEach(i => bal[i].share += t / ids.length);
    });
    const net = state.members.map(m => ({ id: m.id, v: bal[m.id].paid - bal[m.id].share }));
    const cr = net.filter(x => x.v > 0.5).map(x => ({ ...x })).sort((a, b) => b.v - a.v);
    const db = net.filter(x => x.v < -0.5).map(x => ({ id: x.id, v: -x.v })).sort((a, b) => b.v - a.v);
    const pay = []; let i = 0, j = 0;
    while (i < db.length && j < cr.length) {
      const a = Math.min(db[i].v, cr[j].v); pay.push([db[i].id, cr[j].id, a]);
      db[i].v -= a; cr[j].v -= a; if (db[i].v < 0.5) i++; if (cr[j].v < 0.5) j++;
    }
    return `<div class="sub">總支出（台幣）</div><div class="total">${nt(ex.reduce((s, e) => s + twd(e), 0))}</div>
      <h3>每人結算</h3><table><tr><th></th><th>已付</th><th>應分攤</th><th>差額</th></tr>
      ${state.members.map(m => { const b = bal[m.id], n = b.paid - b.share; return `<tr><td>${esc(m.name)}</td><td>${Math.round(b.paid).toLocaleString()}</td><td>${Math.round(b.share).toLocaleString()}</td><td class="${n >= 0 ? 'pos' : 'neg'}">${n >= 0 ? '+' : ''}${Math.round(n).toLocaleString()}</td></tr>`; }).join('')}</table>
      <h3>建議還款</h3>${pay.length ? pay.map(p => `<div class="row"><span>${esc(mname(p[0]))} → ${esc(mname(p[1]))}</span><span class="amt">${nt(p[2])}</span></div>`).join('') : '<div class="sub">目前沒有需要還款的人。</div>'}
      <h3>支出紀錄</h3>${ex.map(e => `<div class="row" data-edit="expenses:${e.id}"><div><strong>${esc(e.title)}</strong><div class="sub">${fmtDay(e.day)} · ${esc(mname(e.payer))} 付 · ${(e.split?.length || state.members.length)} 人分攤</div></div>
        <div class="amt">${Number(e.amount).toLocaleString()} ${esc(e.currency)}${e.currency !== 'TWD' ? `<div class="sub">≈ ${nt(twd(e))}</div>` : ''}</div></div>`).join('')}` + add('expenses');
  }
};

let fresh = true;
function render() {
  document.body.className = TRIP ? '' : 'home';
  $('#back').hidden = $('#share').hidden = !TRIP;
  const t = curTrip();
  $('#ttl').textContent = TRIP ? (t?.name || '旅程') : '旅行手帳';
  document.title = TRIP ? (t?.name || '旅程') + ' · 旅行手帳' : '旅行手帳';
  $('#tabs').innerHTML = TRIP ? Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v}</button>`).join('') : '';
  const head = TRIP ? `<div class="hero">${scene()}</div>${t ? `<div class="meta">${esc(t.dest || '')} ${range(t)} ${countdown(t) ? '· ' + countdown(t) : ''}</div>` : ''}` : '';
  const v = $('#view');
  v.className = fresh ? 'in' : '';
  v.innerHTML = head + (TRIP ? views[tab]() : views.home());
  fresh = false;
}
document.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const el = e.target.closest('[data-tab],[data-add],[data-edit],[data-go]'); if (!el) return;
  if (el.dataset.go) location.search = '?trip=' + encodeURIComponent(el.dataset.go);
  else if (el.dataset.tab) { tab = el.dataset.tab; fresh = true; render(); scrollTo(0, 0); }
  else if (el.dataset.add) openForm(el.dataset.add);
  else { const [t, id] = el.dataset.edit.split(':'); openForm(t, id); }
});
$('#back').onclick = () => { location.href = location.pathname; };
$('#share').onclick = async () => {
  const url = location.origin + location.pathname + '?trip=' + encodeURIComponent(TRIP);
  try { await navigator.clipboard.writeText(url); toast('已複製這趟旅程的連結'); } catch (e) { prompt('複製這個連結', url); }
};
addEventListener('online', loadAll);
addEventListener('offline', () => { online = false; setSync(); });

setSync(); render(); loadAll(); subscribe();
</script>
</body>
</html>
